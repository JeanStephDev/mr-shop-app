def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Lit android/key.properties (jamais commité — voir BUILD_AND_SIGN_APK.md)
// pour signer automatiquement le build release. Si le fichier n'existe pas
// (ex: build de debug local), on retombe sur la signature debug par défaut
// sans faire planter le build.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

apply plugin: "com.android.application"
apply plugin: "kotlin-android"
apply plugin: "dev.flutter.flutter-gradle-plugin"

android {
    namespace "org.triax.mr.shop.app"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        // Requis par flutter_local_notifications
        coreLibraryDesugaringEnabled true

        // GitHub Actions (Temurin) utilise JDK 17
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "org.triax.mr.shop.app"
        minSdkVersion 21
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug

            // Minification désactivée TEMPORAIREMENT : R8 peut supprimer par
            // erreur des classes nécessaires à certains plugins (accès par
            // réflexion) si les règles ProGuard sont incomplètes — cause très
            // classique d'un crash au lancement qui n'apparaît qu'en release,
            // jamais en debug. On réactivera une fois l'app stable, avec des
            // règles ProGuard complètes et testées.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // Le plugin Kotlin de Flutter inclut déjà le stdlib nécessaire — pas besoin
    // de dépendance kotlin-stdlib manuelle qui risquerait de référencer une
    // variable de version absente selon le template Flutter généré.
    implementation 'androidx.multidex:multidex:2.0.1'

    // Requis par flutter_local_notifications (Core Library Desugaring)
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
